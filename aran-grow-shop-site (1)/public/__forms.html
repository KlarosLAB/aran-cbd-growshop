<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Formularios</title>
<!-- Tells Netlify which forms the site has. Visitors never see this page. -->
<form name="lista" data-netlify="true" netlify-honeypot="bot-field" hidden>

  <input name="bot-field">
  <input name="email" type="email">
  <input name="idioma" type="text">
  <input name="consentimiento" type="text">
</form>
